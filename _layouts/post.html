---
layout: default
head_css: [/css/post.css]
---
<div id="main">
  <article>
    {% if page.date %}
    <header>
      <p class="post-meta">{{ page.date | date: "%b %-d, %Y" }}{% if page.author %} • {{ page.author }}{% endif %}{% if page.meta %} • {{ page.meta }}{% endif %}</p>
    </header>
    {% endif %}

    <section class="post">
      {{ content }}
    </section>
  </article>
</div>
