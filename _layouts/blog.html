---
layout: default
head_css: [/css/blog.css, /css/list.css]
---

<div id="main">
  <article>
    <header>
      <!--
      <h1 class="post-title">{{ page.title }}</h1>
      -->
      <p class="post-meta">{{ page.date | date: "%b %-d, %Y" }}{% if page.author %} • {{ page.author }}{% endif %}{% if page.meta %} • {{ page.meta }}{% endif %}</p>
    </header>

    <div class="blog list">
    <section class="blog" id="blog">
      {{ content }}
    </section>
    </div>
  </article>

</div>
